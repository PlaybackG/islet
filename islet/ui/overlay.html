<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Islet — снимок</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none;
    font: 13px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #fff; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #shade { pointer-events: none; }
  .sel-info { position: fixed; padding: 3px 7px; border-radius: 6px; background: rgba(0,0,0,.75); font-size: 12px; pointer-events: none; display: none; font-variant-numeric: tabular-nums; }
  .bar { position: fixed; display: none; gap: 2px; padding: 4px; border-radius: 12px; background: rgba(18,18,20,.94);
    box-shadow: 0 8px 30px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.08); cursor: default; }
  .bar button { border: 0; background: transparent; color: #fff; font: inherit; padding: 7px 11px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .bar button:hover { background: rgba(255,255,255,.1); }
  .bar button.primary { background: #0a84ff; }
  .bar button.primary:hover { background: #2a94ff; }
  .bar kbd { opacity: .55; font: inherit; font-size: 11px; margin-left: 4px; }
  .hint { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); padding: 7px 14px; border-radius: 99px;
    background: rgba(0,0,0,.72); pointer-events: none; font-size: 13px; }
  .loupe { position: fixed; display: none; pointer-events: none; width: 132px; border-radius: 14px; overflow: hidden;
    background: #111; box-shadow: 0 8px 30px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.12); }
  .loupe canvas { position: static; width: 132px; height: 132px; image-rendering: pixelated; }
  .loupe .hex { display: flex; align-items: center; gap: 7px; padding: 6px 9px; font-variant-numeric: tabular-nums; }
  .loupe .sw { width: 14px; height: 14px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
</style>
</head>
<body>
<canvas id="shot"></canvas>
<canvas id="shade"></canvas>
<div class="hint" id="hint"></div>
<div class="sel-info" id="info"></div>
<div class="bar" id="bar">
  <button class="primary" data-a="copy">Копировать<kbd>Enter</kbd></button>
  <button data-a="save">Сохранить<kbd>Ctrl+S</kbd></button>
  <button data-a="ocr">Текст<kbd>T</kbd></button>
  <button data-a="qr">QR</button>
  <button data-a="cancel">Отмена<kbd>Esc</kbd></button>
</div>
<div class="loupe" id="loupe"><canvas id="zoom" width="11" height="11"></canvas><div class="hex"><span class="sw" id="sw"></span><span id="hex"></span></div></div>
<script src="../node_modules/jsqr/dist/jsQR.js"></script>
<script src="overlay.js"></script>
</body>
</html>
